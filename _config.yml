title: Rohit Chatterjee
description: Research in cryptography and theoretical computer science.
url: "https://rohit656.github.io"
baseurl: "/webbpage"

# Blog posts live in _posts/ as YYYY-MM-DD-slug.md and are served at /webbpage/blog/YYYY/MM/slug/
permalink: /blog/:year/:month/:title/

markdown: kramdown
kramdown:
  # $$...$$ in Markdown becomes \(...\) inline or \[...\] display, rendered by KaTeX (see _includes/head.html)
  math_engine: mathjax
  # Text-style return arrow in footnotes (otherwise macOS/iOS draw an emoji)
  footnote_backlink: '&#8617;&#xfe0e;'

plugins:
  - jekyll-feed
  - jekyll-seo-tag

feed:
  path: blog/feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - README.md
  - BLOG_STYLE_GUIDE.md
  - Gemfile
  - Gemfile.lock
